<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бюджет и исполнение по проекту — пример</title>
<script src="model.js"></script>
<style>
  :root {
    --blue: #013d85;
    --blue-2: #0b4f9c;
    --ink: #172033;
    --muted: #526173;
    --line: #d5dee8;
    --bg: #e6edf4;
    --card: #ffffff;
    --green: #1b7a45;
    --green-s: #e5f5ec;
    --red: #a11f1a;
    --red-s: #fdeceb;
    --gold: #8a5a00;
    --gold-s: #fff6df;
    --ok: #1b7a45;
    --warn: #8a5a00;
    --bad: #a11f1a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Golos Text", "Segoe UI", "Helvetica Neue", sans-serif;
    color: var(--ink);
    background: var(--bg);
    font-size: 15px;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .shell { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
  header.top {
    background: var(--blue);
    color: white;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    padding: 16px 22px 14px;
  }
  header.top h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.02em; }
  header.top p { margin: 4px 0 0; color: #d5e4f7; font-size: 13.5px; }
  .brand { text-align: right; font-weight: 650; letter-spacing: 0.04em; font-size: 14px; }
  .brand span { display: block; font-weight: 450; letter-spacing: 0; color: #d5e4f7; font-size: 12px; margin-top: 3px; }
  .body { display: grid; grid-template-columns: 292px 1fr; min-height: 0; }
  aside {
    background: #f7f9fb;
    border-right: 1px solid var(--line);
    overflow: auto;
    padding: 12px 10px 18px;
  }
  .group { margin: 12px 8px 6px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .sc {
    display: block;
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    border-radius: 8px;
    padding: 8px 10px;
    margin: 0 0 2px;
  }
  .sc strong { display: block; font-size: 14px; font-weight: 650; }
  .sc:hover { background: #e8eef5; }
  .sc[aria-pressed="true"] { background: var(--green-s); box-shadow: inset 3px 0 0 var(--green); }
  .sc:focus-visible, .port:focus-visible, .rowbtn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 12px 14px 0; gap: 10px; }
  .lead {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: center;
  }
  .lead h2 { margin: 0 0 4px; font-size: 16px; }
  .lead p { margin: 0; color: var(--muted); line-height: 1.4; }
  .kpis { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .kpi { background: #f4f7fb; border-radius: 8px; padding: 6px 10px; min-width: 92px; }
  .kpi b { display: block; font-size: 16px; }
  .kpi span { color: var(--muted); font-size: 11px; }
  .kpi.bad b { color: var(--red); }
  .kpi.ok b { color: var(--green); }
  .funnel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px 12px;
  }
  .funnel .cap { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .bar { display: grid; grid-template-columns: 148px 1fr 92px; gap: 8px; align-items: center; margin: 5px 0; }
  .bar i { font-style: normal; font-size: 13px; }
  .track { height: 14px; background: #e7eef5; border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 99px; transition: width .35s ease; }
  .fill.budget { background: #9aafc4; }
  .fill.commit { background: var(--blue-2); }
  .fill.paid { background: #e0a106; }
  .fill.done { background: var(--green); height: 18px; }
  .bar.done .track { height: 18px; }
  .bar b { font-size: 13px; text-align: right; }
  .wrap { overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px 10px 0 0; min-height: 0; flex: 1; }
  table { width: 100%; border-collapse: collapse; }
  th {
    position: sticky; top: 0; background: #f3f6fa; text-align: left;
    font-size: 11.5px; letter-spacing: 0.03em; text-transform: uppercase; color: var(--muted);
    padding: 8px 10px; border-bottom: 1px solid var(--line); z-index: 1;
  }
  td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr.hit td { background: var(--red-s); box-shadow: inset 3px 0 0 var(--red); }
  tr.hit td:not(:first-child) { box-shadow: none; }
  tr.okhit td { background: var(--green-s); box-shadow: inset 3px 0 0 var(--green); }
  tr.okhit td:not(:first-child) { box-shadow: none; }
  tr[role="button"] { cursor: pointer; }
  tr[role="button"]:hover td { background: #f4f8fc; }
  tr.hit:hover td { background: #fde4e1; }
  tr.open td { background: #f7fbff; }
  .rowbtn {
    display: block; width: 100%; text-align: left; background: transparent; border: 0;
    padding: 8px 10px; border-left: 3px solid transparent;
  }
  tr.hit .rowbtn { background: var(--red-s); border-left-color: var(--red); }
  tr.okhit .rowbtn { background: var(--green-s); border-left-color: var(--green); }
  tr.open .rowbtn { background: #f7fbff; }
  .nm { font-weight: 650; }
  .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; line-height: 1.35; }
  .slip { font-weight: 700; }
  .slip.bad { color: var(--red); }
  .slip.ok { color: var(--green); }
  .slip.mute { color: var(--muted); font-weight: 500; }
  .detail { padding: 4px 14px 14px 16px; background: #f8fbfe; }
  .grid { display: grid; grid-template-columns: 1.1fr 1.2fr 0.8fr; gap: 14px; }
  .detail h3 { margin: 8px 0 6px; font-size: 13px; }
  .quote { margin: 0; line-height: 1.4; }
  .src { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .step { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px dashed #e1e8f0; font-size: 13.5px; }
  .step em { font-style: normal; color: var(--muted); }
  .step.extra { color: var(--red); font-weight: 650; }
  .moneyline { display: flex; justify-content: space-between; padding: 3px 0; font-size: 13.5px; }
  footer.port {
    display: grid; grid-template-columns: minmax(200px, 280px) 1fr 1fr 1fr; gap: 8px;
    padding: 10px 12px; background: #0e1c2e; color: white; align-items: center;
  }
  footer.port .hint { font-size: 12.5px; color: #d5e0ea; line-height: 1.35; }
  .port {
    text-align: left; background: #1a2c44; color: white; border: 1px solid #2d4668;
    border-radius: 8px; padding: 7px 10px; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px;
  }
  .port[aria-pressed="true"] { border-color: #7dcea0; background: #163526; }
  .port b { font-size: 13.5px; }
  .port span { font-size: 12px; color: #c5d2e0; }
  .dot { width: 8px; height: 8px; border-radius: 99px; display: inline-block; margin-right: 6px; }
  .dot.ok { background: #3ddc84; }
  .dot.warn { background: #f5c451; }
  .dot.bad { background: #ff6b64; }
  .mini { height: 4px; background: #2d4668; border-radius: 99px; grid-column: 1 / -1; }
  .mini i { display: block; height: 100%; background: #3ddc84; border-radius: 99px; }
  @media (max-width: 1100px) {
    .body { grid-template-columns: 240px 1fr; }
    .grid { grid-template-columns: 1fr; }
    .lead { grid-template-columns: 1fr; }
    footer.port { grid-template-columns: 1fr 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .fill { transition: none; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div>
      <h1>Бюджет и исполнение по проекту</h1>
      <p id="subtitle"></p>
    </div>
    <div class="brand">sergek group<span>пример для доклада, цифры вымышлены</span></div>
  </header>
  <div class="body">
    <aside id="rail"></aside>
    <main>
      <section class="lead">
        <div>
          <h2 id="scene-title"></h2>
          <p id="scene-lead"></p>
        </div>
        <div class="kpis" id="kpis"></div>
      </section>
      <section class="funnel" id="funnel"></section>
      <div class="wrap">
        <table>
          <thead>
            <tr>
              <th>Товар, работа, услуга</th>
              <th>Способ</th>
              <th>Потребность</th>
              <th>Подать заявку</th>
              <th>Прогноз</th>
              <th>К дате</th>
              <th>Сейчас</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </main>
  </div>
  <footer class="port" id="portfolio"></footer>
</div>
<script>
const M = window.BudgetShow;
const state = { project: "a14", scenario: "plan", open: null };

function healthOf(v) {
  if (!v.totals.lateCount) return { word: "В графике", tone: "ok" };
  if (v.pastCommission || v.totals.lateCount >= 4) return { word: "Веха под угрозой", tone: "bad" };
  return { word: "Есть сдвиг", tone: "warn" };
}
function slipText(r) {
  if (r.undated) return "нет даты";
  if (r.slip > 0) return "+" + r.slip + " дн";
  return "в срок";
}
function slipClass(r) {
  if (r.undated) return "mute";
  if (r.slip > 0) return "bad";
  return "ok";
}
function pct(n) { return Math.round(n * 1000) / 10; }
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function cell(text, cls) {
  const td = document.createElement("td");
  if (cls) td.className = cls;
  td.textContent = text;
  return td;
}
function payWords(pay) {
  if (pay === "advance") return "аванс 40% до отгрузки, 3 р.д.";
  if (pay === "prepay") return "предоплата 100% до выдачи, 3 р.д.";
  return "оплата после приёмки, дату не двигает";
}
function kindLead(kind) {
  if (kind === "Товар") return "поставка";
  if (kind === "Работа") return "выполнение работ";
  return "оказание";
}

function readHash() {
  const parts = location.hash.replace(/^#/, "").split("/").filter(Boolean);
  if (parts[0] && M.PROJECTS.some((p) => p.id === parts[0])) state.project = parts[0];
  if (parts[1] && M.SCENARIOS.some((s) => s.id === parts[1])) state.scenario = parts[1];
  state.open = parts[2] || null;
}
function writeHash() {
  const next = "#" + state.project + "/" + state.scenario + (state.open ? "/" + state.open : "");
  if (location.hash !== next) history.replaceState(null, "", next);
}

function render() {
  const v = M.view(state.project, state.scenario);
  const health = healthOf(v);
  document.getElementById("subtitle").textContent =
    v.project.title + " · " + v.project.subtitle +
    " · срез " + M.longDate(v.today) +
    " · ввод " + M.longDate(v.project.commissioning) +
    " · сроки процедур из Правил закупок, приказ №13-О/Д-ОД от 15.12.2025";

  const rail = document.getElementById("rail");
  rail.replaceChildren();
  if (!v.project.interactive) {
    const note = el("p", "sub");
    note.style.padding = "4px 8px 0";
    note.textContent = v.scenario.lead;
    rail.appendChild(note);
  }
  let group = "";
  M.SCENARIOS.forEach((s) => {
    if (s.group !== group) {
      group = s.group;
      rail.appendChild(el("div", "group", group));
    }
    const b = el("button", "sc");
    b.type = "button";
    b.setAttribute("aria-pressed", String(v.project.interactive && v.scenario.id === s.id));
    b.appendChild(el("strong", "", s.title));
    b.addEventListener("click", () => {
      state.project = "a14";
      state.scenario = s.id;
      state.open = null;
      writeHash();
      render();
    });
    rail.appendChild(b);
  });

  document.getElementById("scene-title").textContent = v.project.interactive ? v.scenario.title : v.project.title + " — снимок";
  document.getElementById("scene-lead").textContent = v.project.interactive ? v.scenario.lead : v.scenario.lead;

  const kpis = document.getElementById("kpis");
  kpis.replaceChildren();
  const cards = [
    [M.money(v.totals.budget), "бюджет"],
    [pct(v.totals.execution) + "%", "исполнение, поставлено"],
    [String(v.totals.lateCount), "строк позже своей даты", v.totals.lateCount ? "bad" : "ok"],
    [String(v.pastCommission), "позже ввода", v.pastCommission ? "bad" : "ok"],
  ];
  cards.forEach(([value, label, tone]) => {
    const k = el("div", "kpi" + (tone ? " " + tone : ""));
    k.appendChild(el("b", "", value));
    k.appendChild(el("span", "", label));
    kpis.appendChild(k);
  });

  const funnel = document.getElementById("funnel");
  funnel.replaceChildren();
  const cap = el("div", "cap");
  cap.appendChild(el("span", "", "Исполнение бюджета — поставленные и принятые ТРУ. Договор и оплата показывают шаг денег."));
  cap.appendChild(el("span", "", v.totals.noDate + " строки без даты не входят в расчёт срока"));
  funnel.appendChild(cap);
  const scale = v.totals.budget || 1;
  [
    ["Бюджет", v.totals.budget, "budget", false],
    ["Договор заключён", v.totals.committed, "commit", false],
    ["Оплачено", v.totals.paid, "paid", false],
    ["Поставлено", v.totals.delivered, "done", true],
  ].forEach(([label, value, cls, thick]) => {
    const row = el("div", "bar" + (thick ? " done" : ""));
    row.appendChild(el("i", "", label));
    const track = el("div", "track");
    const fill = el("div", "fill " + cls);
    fill.style.width = Math.max(0, Math.min(100, value / scale * 100)) + "%";
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el("b", "", M.money(value)));
    funnel.appendChild(row);
  });

  const body = document.getElementById("rows");
  body.replaceChildren();
  v.rows.forEach((r) => {
    const tr = document.createElement("tr");
    if (r.inScenario && r.tone === "ok") tr.className = "okhit";
    else if (r.inScenario || r.slip > 0) tr.className = "hit";
    if (state.open === r.id) tr.classList.add("open");
    const name = document.createElement("td");
    name.appendChild(el("div", "nm", r.name));
    const cause = r.cause || (r.undated ? r.quote : r.spec + " · " + r.kind);
    name.appendChild(el("div", "sub", r.undated || r.cause ? cause : r.spec + " · " + r.kind));
    tr.appendChild(name);
    tr.appendChild(cell(r.methodTitle));
    tr.appendChild(cell(r.undated ? "—" : M.shortDate(r.needIso)));
    tr.appendChild(cell(r.undated ? "—" : M.shortDate(r.planStartIso)));
    tr.appendChild(cell(r.undated ? "—" : M.shortDate(r.forecastIso)));
    tr.appendChild(cell(slipText(r), "slip " + slipClass(r)));
    tr.appendChild(cell(r.stage));
    tr.tabIndex = 0;
    tr.setAttribute("role", "button");
    tr.setAttribute("aria-expanded", String(state.open === r.id));
    const toggle = () => {
      state.open = state.open === r.id ? null : r.id;
      writeHash();
      render();
    };
    tr.addEventListener("click", toggle);
    tr.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        toggle();
      }
    });
    body.appendChild(tr);
    if (state.open === r.id) {
      const extra = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 7;
      td.appendChild(detail(r, v));
      extra.appendChild(td);
      body.appendChild(extra);
    }
  });

  const foot = document.getElementById("portfolio");
  foot.replaceChildren();
  const hint = el("div", "hint", "← → меняют сценарий. Щелчок по строке раскрывает расчёт даты.");
  foot.appendChild(hint);
  M.PROJECTS.forEach((p) => {
    const snap = M.view(p.id, p.interactive ? state.scenario : "lock");
    const h = healthOf(snap);
    const b = el("button", "port");
    b.type = "button";
    b.setAttribute("aria-pressed", String(p.id === state.project));
    const title = el("b", "");
    title.appendChild(el("i", "dot " + h.tone));
    title.append(p.code + " " + p.subtitle);
    b.appendChild(title);
    b.appendChild(el("span", "", h.word + " · " + pct(snap.totals.execution) + "%"));
    const mini = el("div", "mini");
    const bar = document.createElement("i");
    bar.style.width = pct(snap.totals.execution) + "%";
    if (h.tone === "bad") bar.style.background = "#ff6b64";
    if (h.tone === "warn") bar.style.background = "#f5c451";
    mini.appendChild(bar);
    b.appendChild(mini);
    b.addEventListener("click", () => {
      state.project = p.id;
      state.open = null;
      writeHash();
      render();
    });
    foot.appendChild(b);
  });
  writeHash();
}

function detail(r, v) {
  const box = el("div", "detail");
  const grid = el("div", "grid");
  const left = el("div");
  left.appendChild(el("h3", "", "Откуда строка"));
  left.appendChild(el("p", "quote", r.undated ? r.quote : "«" + r.quote + "»"));
  left.appendChild(el("div", "src", r.source + (r.milestone && r.milestone !== "—" ? " · веха «" + r.milestone + "»" : "")));
  if (!r.undated) {
    const formula = el("p", "quote");
    formula.style.marginTop = "10px";
    const payBit = r.pay === "post" ? "" : " − 3 р.д. на оплату до отгрузки";
    formula.textContent = "Дата заявки " + M.longDate(r.planStartIso) + " = потребность " + M.longDate(r.needIso) + " − " + r.lead + " к.д. (" + kindLead(r.kind) + ")" + payBit + " − " + r.norm + " р.д. процедуры (" + r.methodTitle + ").";
    left.appendChild(formula);
  }
  grid.appendChild(left);

  const mid = el("div");
  mid.appendChild(el("h3", "", "Норматив и что добавилось"));
  if (r.undated) {
    mid.appendChild(el("p", "quote", "Даты в пакете нет, обратный счёт не строится. Руководитель проекта закрывает дату вручную, после этого строка попадает в план."));
  } else {
    r.steps.forEach((s) => {
      const row = el("div", "step");
      row.appendChild(el("span", "", s.label));
      row.appendChild(el("em", "", s.days + " р.д. · " + s.clause));
      mid.appendChild(row);
    });
    if (r.pay !== "post") {
      const row = el("div", "step");
      row.appendChild(el("span", "", r.pay === "prepay" ? "Предоплата 100%" : "Аванс 40%"));
      row.appendChild(el("em", "", "3 р.д. · до отгрузки"));
      mid.appendChild(row);
    } else {
      const row = el("div", "step");
      row.appendChild(el("span", "", "Оплата после приёмки"));
      row.appendChild(el("em", "", "дату поставки не двигает"));
      mid.appendChild(row);
    }
    const lead = el("div", "step");
    lead.appendChild(el("span", "", kindLead(r.kind)[0].toUpperCase() + kindLead(r.kind).slice(1)));
    lead.appendChild(el("em", "", r.lead + " к.д."));
    mid.appendChild(lead);
    r.extras.forEach((x) => {
      const row = el("div", "step extra");
      row.appendChild(el("span", "", x.label));
      row.appendChild(el("em", "", x.days ? "+" + x.days + " " + x.unit : ""));
      mid.appendChild(row);
    });
  }
  grid.appendChild(mid);

  const right = el("div");
  right.appendChild(el("h3", "", "Деньги строки"));
  [
    ["Бюджет", r.amount],
    ["Договор", r.committed],
    ["Оплачено", r.paid],
    ["Принято", r.delivered],
  ].forEach(([label, value]) => {
    const row = el("div", "moneyline");
    row.appendChild(el("span", "", label));
    row.appendChild(el("b", "", M.money(value)));
    right.appendChild(row);
  });
  right.appendChild(el("div", "src", "Условие оплаты: " + payWords(r.pay) + "."));
  if (!r.undated) {
    right.appendChild(el("div", "src", "Прогноз поставки " + M.longDate(r.forecastIso) + ". Ввод участка " + M.longDate(v.project.commissioning) + "."));
  }
  grid.appendChild(right);
  box.appendChild(grid);
  return box;
}

document.addEventListener("keydown", (e) => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const ids = M.SCENARIOS.map((s) => s.id);
  let i = ids.indexOf(state.scenario);
  if (i < 0) i = 0;
  i = e.key === "ArrowRight" ? (i + 1) % ids.length : (i - 1 + ids.length) % ids.length;
  state.project = "a14";
  state.scenario = ids[i];
  state.open = null;
  writeHash();
  render();
  const pressed = document.querySelector('.sc[aria-pressed="true"]');
  if (pressed) pressed.scrollIntoView({ block: "nearest" });
});

readHash();
render();
</script>
</body>
</html>
